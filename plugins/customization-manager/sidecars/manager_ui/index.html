<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rules &amp; MCP Manager</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-dot"></span>
          <h1 class="brand-title">Rules &amp; MCP 控制中心</h1>
        </div>
        <div class="topbar-actions">
          <button id="btn-paths" class="btn btn-ghost btn-xs" type="button" title="切换主配置源或绑定工作区路径">路径</button>
          <button id="btn-refresh" class="btn btn-ghost btn-xs" type="button" title="重新扫描本地配置">刷新</button>
        </div>
      </div>

      <div id="paths-drawer" class="paths-drawer hidden">
        <label class="field-inline">
          <span>主配置源</span>
          <input id="input-master-dir" class="input mono" type="text" placeholder="默认 ~/.gemini/config">
        </label>
        <label class="field-inline">
          <span>项目工作区（可选）</span>
          <input id="input-workspace-dir" class="input mono" type="text" placeholder="留空仅管理全局配置">
        </label>
        <div class="drawer-actions">
          <button id="btn-reset-master" class="btn btn-ghost btn-xs" type="button">恢复默认全局</button>
          <button id="btn-save-paths" class="btn btn-primary btn-xs" type="button">应用路径</button>
        </div>
      </div>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="rules" type="button">规则 <span id="badge-rules" class="tab-badge">0</span></button>
        <button class="tab" data-tab="mcp" type="button">MCP <span id="badge-mcp" class="tab-badge">0</span></button>
        <button class="tab" data-tab="clients" type="button">跨端同步 <span id="badge-clients" class="tab-badge">0</span></button>
        <button class="tab" data-tab="more" type="button">Hooks/盘点</button>
      </nav>
    </header>

    <div id="toast" class="toast hidden" role="status"></div>

    <main class="main">
      <!-- TAB: RULES -->
      <section id="panel-rules" class="panel">
        <div class="budget-card">
          <div class="budget-row">
            <span class="muted">常驻全局规则预算</span>
            <span id="budget-text" class="mono">0 / 20,000 tok</span>
          </div>
          <div class="progress-track">
            <div id="budget-fill" class="progress-fill" style="width: 0%"></div>
          </div>
          <div class="toolbar">
            <button id="btn-new-rule" class="btn btn-primary btn-xs" type="button">+ 新建规则</button>
            <select id="select-rule-template" class="select select-xs" aria-label="导入规则模板">
              <option value="">套用预设模板…</option>
            </select>
          </div>
        </div>
        <div id="rules-list" class="list"></div>
      </section>

      <!-- TAB: MCP -->
      <section id="panel-mcp" class="panel hidden">
        <div class="toolbar-card">
          <div class="toolbar">
            <button id="btn-new-mcp" class="btn btn-primary btn-xs" type="button">+ 添加 MCP</button>
            <button id="btn-mcp-raw" class="btn btn-ghost btn-xs" type="button">原始 JSON</button>
            <button id="btn-mcp-reload" class="btn btn-ghost btn-xs" type="button" title="触发 Antigravity 重载 MCP 服务">重载 MCP</button>
          </div>
          <select id="select-mcp-template" class="select select-xs" aria-label="导入 MCP 模板">
            <option value="">套用 MCP 示例…</option>
          </select>
        </div>
        <div id="mcp-list" class="list"></div>
      </section>

      <!-- TAB: CLIENTS & LINKS -->
      <section id="panel-clients" class="panel hidden">
        <div class="toolbar-card">
          <div class="sync-summary">
            <span id="clients-summary" class="muted">检测中…</span>
          </div>
          <div class="toolbar">
            <button id="btn-preview-all" class="btn btn-ghost btn-xs" type="button">预览全部差异</button>
            <button id="btn-sync-all" class="btn btn-primary btn-xs" type="button">一键同步已启用</button>
            <button id="btn-new-target" class="btn btn-ghost btn-xs" type="button">+ 自定义目标</button>
          </div>
        </div>
        <div id="clients-list" class="list"></div>
      </section>

      <!-- TAB: HOOKS & INVENTORY -->
      <section id="panel-more" class="panel hidden">
        <div class="section-head">
          <span class="section-title">生命周期钩子 (`hooks.json`)</span>
          <div class="toolbar">
            <button id="btn-hook-template" class="btn btn-ghost btn-xs" type="button">+ 安全示例</button>
            <button id="btn-hooks-raw" class="btn btn-ghost btn-xs" type="button">编辑 JSON</button>
          </div>
        </div>
        <div id="hooks-list" class="list"></div>

        <div class="section-head" style="margin-top: 14px;">
          <span class="section-title">Skills 与插件盘点（只读）</span>
          <button id="btn-reload-inventory" class="btn btn-ghost btn-xs" type="button">重新扫描</button>
        </div>
        <div id="inventory-list" class="list"></div>
      </section>
    </main>

    <!-- MODAL -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modal-title" class="modal-title">编辑</h2>
          <button id="modal-close" class="btn btn-ghost btn-xs" type="button">关闭</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-foot" class="modal-foot"></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
